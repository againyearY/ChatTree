<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枝 · Branch Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* === RESET & VARIABLES === */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-warm: #f6f1eb;
  --bg-sidebar: #ede7df;
  --bg-input: #faf8f5;
  --ink: #2c2825;
  --ink-light: #6b6560;
  --ink-faint: #a8a099;
  --accent: #3d5a80;
  --accent-light: #dce4ed;
  --accent-glow: #5b8cb8;
  --user-bubble: #3d5a80;
  --user-text: #f0f4f8;
  --ai-bubble: #ffffff;
  --ai-border: #e0dbd5;
  --danger: #c1574f;
  --danger-light: #f5e0de;
  --success: #5a7a5a;
  --tree-line: #cfc7bc;
  --highlight: #fdf4e3;
  --shadow-sm: 0 1px 3px rgba(44,40,37,0.06);
  --shadow-md: 0 4px 12px rgba(44,40,37,0.08);
  --shadow-lg: 0 8px 30px rgba(44,40,37,0.12);
  --radius: 10px;
  --radius-lg: 16px;
  --font-serif: 'Noto Serif SC', 'Crimson Pro', Georgia, serif;
  --font-mono: 'JetBrains Mono', 'Menlo', monospace;
  --sidebar-w: 340px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
  height: 100%;
  font-family: var(--font-serif);
  background: var(--bg-warm);
  color: var(--ink);
  overflow: hidden;
}

/* === LAYOUT === */
.app {
  display: flex;
  height: 100vh;
  position: relative;
}

/* === SIDEBAR === */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--tree-line);
  display: flex;
  flex-direction: column;
  transition: margin-left var(--transition), opacity var(--transition);
  position: relative;
  z-index: 10;
}
.sidebar.collapsed {
  margin-left: calc(-1 * var(--sidebar-w));
  opacity: 0;
  pointer-events: none;
}

.sidebar-header {
  padding: 20px 20px 12px;
  border-bottom: 1px solid var(--tree-line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-header h1 {
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--ink);
}
.sidebar-header h1 span {
  color: var(--accent);
}

/* Toggle button */
.toggle-btn {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 100;
  width: 40px;
  height: 40px;
  border: 1px solid var(--tree-line);
  border-radius: var(--radius);
  background: var(--bg-warm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}
.toggle-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  box-shadow: var(--shadow-md);
}
.toggle-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.sidebar:not(.collapsed) ~ .toggle-btn { left: calc(var(--sidebar-w) + 16px); }

/* Config section */
.config-section {
  padding: 16px 20px;
  border-bottom: 1px solid var(--tree-line);
  overflow: hidden;
  transition: max-height var(--transition), padding var(--transition);
}
.config-section.collapsed-config {
  max-height: 40px;
  padding-bottom: 0;
  overflow: hidden;
}
.config-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  margin-bottom: 12px;
}
.config-toggle h2 {
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-light);
}
.config-toggle .arrow {
  font-size: 0.7rem;
  color: var(--ink-faint);
  transition: transform var(--transition);
}
.config-section.collapsed-config .arrow { transform: rotate(-90deg); }

.config-field { margin-bottom: 12px; }
.config-field label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-faint);
  margin-bottom: 4px;
  font-family: var(--font-mono);
}
.config-field input,
.config-field textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--tree-line);
  border-radius: 8px;
  background: var(--bg-input);
  font-family: var(--font-serif);
  font-size: 0.88rem;
  color: var(--ink);
  transition: border-color var(--transition), box-shadow var(--transition);
  outline: none;
  resize: vertical;
}
.config-field textarea { min-height: 60px; font-size: 0.82rem; }
.config-field input:focus,
.config-field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(61,90,128,0.1);
}

/* Scrollable settings area */
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}
.sidebar-scroll::-webkit-scrollbar { width: 5px; }
.sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--tree-line); border-radius: 3px; }

/* Sub-section (character panels, etc.) */
.sub-section {
  border-bottom: 1px solid var(--tree-line);
  padding: 12px 20px;
}
.sub-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  padding: 4px 0;
}
.sub-toggle h3 {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-light);
  display: flex;
  align-items: center;
  gap: 6px;
}
.sub-toggle h3 .badge {
  font-size: 0.6rem;
  background: var(--accent-light);
  color: var(--accent);
  padding: 1px 6px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-weight: 500;
}
.sub-toggle .arrow {
  font-size: 0.65rem;
  color: var(--ink-faint);
  transition: transform var(--transition);
}
.sub-body { padding-top: 10px; }
.sub-section.collapsed-sub .sub-body { display: none; }
.sub-section.collapsed-sub .arrow { transform: rotate(-90deg); }

/* Advanced sub-panel inside character section */
.adv-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
  padding: 6px 0 4px;
  margin-top: 4px;
  border-top: 1px dashed var(--tree-line);
}
.adv-toggle span {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-family: var(--font-mono);
}
.adv-toggle .arrow {
  font-size: 0.6rem;
  color: var(--ink-faint);
  transition: transform var(--transition);
}
.adv-body { padding-top: 8px; }
.adv-panel.collapsed-adv .adv-body { display: none; }
.adv-panel.collapsed-adv .adv-toggle .arrow { transform: rotate(-90deg); }

/* Character field grid (2-col for short fields) */
.char-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.char-grid .config-field { margin-bottom: 0; }
.char-grid .full-width { grid-column: 1 / -1; }

/* Custom key-value pairs */
.custom-fields { margin-top: 8px; }
.custom-row {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}
.custom-row input {
  flex: 1;
  padding: 6px 10px;
  border: 1px solid var(--tree-line);
  border-radius: 6px;
  background: var(--bg-input);
  font-family: var(--font-serif);
  font-size: 0.82rem;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
}
.custom-row input:focus { border-color: var(--accent); }
.custom-row input.key-input {
  flex: 0.4;
  font-family: var(--font-mono);
  font-size: 0.75rem;
}
.custom-row input.val-input { flex: 0.6; }
.custom-row .remove-btn {
  width: 22px;
  height: 22px;
  border: none;
  background: none;
  color: var(--ink-faint);
  cursor: pointer;
  border-radius: 4px;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.custom-row .remove-btn:hover { background: var(--danger-light); color: var(--danger); }

.add-field-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border: 1px dashed var(--tree-line);
  border-radius: 6px;
  background: transparent;
  color: var(--ink-faint);
  font-size: 0.75rem;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: all 0.15s;
  width: 100%;
  justify-content: center;
  margin-top: 4px;
}
.add-field-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(61,90,128,0.04);
}

/* Temperature slider */
.temp-section { padding: 12px 20px; border-bottom: 1px solid var(--tree-line); }
.temp-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.temp-header label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-faint);
  font-family: var(--font-mono);
}
.temp-value {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--accent);
  font-family: var(--font-mono);
  min-width: 32px;
  text-align: right;
}
.temp-slider {
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--tree-line);
  outline: none;
  cursor: pointer;
}
.temp-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg-sidebar);
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  cursor: pointer;
  transition: transform 0.15s;
}
.temp-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
.temp-tips {
  margin-top: 8px;
  font-size: 0.7rem;
  color: var(--ink-faint);
  line-height: 1.5;
  font-family: var(--font-mono);
}
.temp-tips .tip-row {
  display: flex;
  justify-content: space-between;
  padding: 1px 0;
}
.temp-tips .tip-val { color: var(--ink-light); font-weight: 500; }

/* Session management */
.session-section {
  border-bottom: 1px solid var(--tree-line);
  padding: 12px 20px;
}
.session-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.session-header h2 {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
  font-family: var(--font-mono);
}
.new-chat-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: transparent;
  color: var(--accent);
  font-size: 0.72rem;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 600;
}
.new-chat-btn:hover {
  background: var(--accent);
  color: white;
}
.session-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 200px;
  overflow-y: auto;
}
.session-list::-webkit-scrollbar { width: 4px; }
.session-list::-webkit-scrollbar-thumb { background: var(--tree-line); border-radius: 2px; }
.session-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.session-item:hover { background: rgba(61,90,128,0.07); }
.session-item.active {
  background: var(--accent-light);
}
.session-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 3px;
  bottom: 3px;
  width: 3px;
  background: var(--accent);
  border-radius: 2px;
}
.session-icon {
  font-size: 0.7rem;
  color: var(--ink-faint);
  flex-shrink: 0;
}
.session-item.active .session-icon { color: var(--accent); }
.session-info {
  flex: 1;
  min-width: 0;
}
.session-name {
  font-size: 0.78rem;
  color: var(--ink-light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
}
.session-item.active .session-name { color: var(--accent); font-weight: 600; }
.session-meta-text {
  font-size: 0.62rem;
  color: var(--ink-faint);
  font-family: var(--font-mono);
}
.session-actions {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.15s;
  flex-shrink: 0;
}
.session-item:hover .session-actions { opacity: 1; }
.session-act-btn {
  width: 20px;
  height: 20px;
  border: none;
  background: none;
  color: var(--ink-faint);
  cursor: pointer;
  border-radius: 4px;
  font-size: 0.65rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.12s;
}
.session-act-btn:hover { background: rgba(0,0,0,0.06); color: var(--ink); }
.session-act-btn.del:hover { background: var(--danger-light); color: var(--danger); }
.session-empty {
  font-size: 0.75rem;
  color: var(--ink-faint);
  text-align: center;
  padding: 8px 0;
  font-style: italic;
}
/* Inline rename input */
.session-rename-input {
  font-size: 0.78rem;
  padding: 1px 4px;
  border: 1px solid var(--accent);
  border-radius: 4px;
  outline: none;
  background: var(--bg-input);
  color: var(--ink);
  font-family: var(--font-serif);
  width: 100%;
}

/* Tree section */
.tree-section {
  flex: 1;
  overflow-y: auto;
  padding: 12px 8px 12px 12px;
}
.tree-section::-webkit-scrollbar { width: 5px; }
.tree-section::-webkit-scrollbar-track { background: transparent; }
.tree-section::-webkit-scrollbar-thumb { background: var(--tree-line); border-radius: 3px; }

.tree-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
  padding: 0 8px 8px;
  font-family: var(--font-mono);
}

.tree-root { list-style: none; padding-left: 0; }
.tree-root ul { list-style: none; padding-left: 18px; position: relative; }
.tree-root ul::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 0;
  bottom: 12px;
  width: 1px;
  background: var(--tree-line);
}

.tree-node {
  position: relative;
  margin-bottom: 2px;
}
.tree-node-row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
}
.tree-node-row:hover { background: rgba(61,90,128,0.07); }
.tree-node-row.active {
  background: var(--accent-light);
  font-weight: 600;
}
.tree-node-row.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 2px;
  bottom: 2px;
  width: 3px;
  background: var(--accent);
  border-radius: 2px;
}

.tree-expand-btn {
  width: 18px;
  height: 18px;
  border: none;
  background: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-faint);
  font-size: 0.65rem;
  flex-shrink: 0;
  border-radius: 3px;
  transition: all 0.15s;
}
.tree-expand-btn:hover { background: rgba(0,0,0,0.06); color: var(--ink); }

.tree-icon {
  font-size: 0.7rem;
  width: 16px;
  text-align: center;
  flex-shrink: 0;
  color: var(--ink-faint);
}
.tree-node-row.role-user .tree-icon { color: var(--accent); }
.tree-node-row.role-assistant .tree-icon { color: var(--success); }

.tree-text {
  font-size: 0.78rem;
  color: var(--ink-light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.tree-node-row.active .tree-text { color: var(--accent); }

.tree-delete-btn {
  width: 20px;
  height: 20px;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--ink-faint);
  font-size: 0.7rem;
  border-radius: 4px;
  opacity: 0;
  transition: all 0.15s;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tree-node-row:hover .tree-delete-btn { opacity: 1; }
.tree-delete-btn:hover { background: var(--danger-light); color: var(--danger); }

/* === MAIN CHAT AREA === */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}

.chat-header {
  padding: 16px 24px 12px 64px;
  border-bottom: 1px solid var(--tree-line);
  background: rgba(246,241,235,0.85);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.chat-header .path-info {
  font-size: 0.78rem;
  color: var(--ink-faint);
  font-family: var(--font-mono);
}
.chat-header .path-info strong { color: var(--accent); font-weight: 500; }

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--tree-line); border-radius: 3px; }

/* Message bubbles */
.message {
  display: flex;
  flex-direction: column;
  max-width: 75%;
  animation: msgIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user { align-self: flex-end; align-items: flex-end; }
.message.assistant { align-self: flex-start; align-items: flex-start; }

.message-bubble {
  padding: 12px 18px;
  border-radius: var(--radius-lg);
  line-height: 1.65;
  font-size: 0.95rem;
  position: relative;
  box-shadow: var(--shadow-sm);
  word-break: break-word;
}
.message.user .message-bubble {
  background: var(--user-bubble);
  color: var(--user-text);
  border-bottom-right-radius: 4px;
}
.message.assistant .message-bubble {
  background: var(--ai-bubble);
  color: var(--ink);
  border: 1px solid var(--ai-border);
  border-bottom-left-radius: 4px;
}

.message-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  padding: 0 4px;
}
.message-time {
  font-size: 0.68rem;
  color: var(--ink-faint);
  font-family: var(--font-mono);
}
.message-branch-btn {
  font-size: 0.68rem;
  color: var(--ink-faint);
  background: none;
  border: 1px solid transparent;
  cursor: pointer;
  padding: 2px 8px;
  border-radius: 4px;
  font-family: var(--font-mono);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 3px;
}
.message-branch-btn:hover {
  color: var(--accent);
  border-color: var(--accent-light);
  background: var(--accent-light);
}
.message-branch-btn svg { width: 12px; height: 12px; }

.branch-indicator {
  font-size: 0.7rem;
  color: var(--accent);
  background: var(--accent-light);
  padding: 2px 8px;
  border-radius: 4px;
  font-family: var(--font-mono);
}

/* Thinking indicator */
.thinking {
  align-self: flex-start;
  padding: 12px 18px;
  background: var(--ai-bubble);
  border: 1px solid var(--ai-border);
  border-radius: var(--radius-lg);
  border-bottom-left-radius: 4px;
  box-shadow: var(--shadow-sm);
  display: flex;
  gap: 6px;
  align-items: center;
}
.thinking-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ink-faint);
  animation: think 1.4s ease-in-out infinite;
}
.thinking-dot:nth-child(2) { animation-delay: 0.15s; }
.thinking-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes think {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* Error message */
.error-toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--danger);
  color: white;
  padding: 10px 24px;
  border-radius: var(--radius);
  font-size: 0.85rem;

}

  padding: 8px 8px 8px 16px;

}
.input-wrapper:focus-within {

  box-shadow: 0 0 0 3px rgba(61,90,128,0.08);
}

.input-wrapper textarea {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--font-serif);
  font-size: 0.95rem;
  color: var(--ink);
  resize: none;
  min-height: 24px;
  max-height: 120px;
  line-height: 1.5;
  padding: 4px 0;
}
.input-wrapper textarea::placeholder { color: var(--ink-faint); }

.send-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.send-btn:hover:not(:disabled) {
  background: var(--accent-glow);
  box-shadow: 0 2px 8px rgba(61,90,128,0.3);
  transform: translateY(-1px);
}
.send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.send-btn svg { width: 18px; height: 18px; }

/* === CONFIRM DIALOG === */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(44,40,37,0.3);
  backdrop-filter: blur(4px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.confirm-overlay.show { opacity: 1; pointer-events: auto; }
.confirm-box {
  background: var(--bg-warm);
  border: 1px solid var(--tree-line);
  border-radius: var(--radius-lg);
  padding: 28px;
  max-width: 380px;
  width: 90%;
  box-shadow: var(--shadow-lg);
  transform: scale(0.95);
  transition: transform 0.2s;
}
.confirm-overlay.show .confirm-box { transform: scale(1); }
.confirm-box h3 { font-size: 1rem; margin-bottom: 8px; }
.confirm-box p { font-size: 0.88rem; color: var(--ink-light); margin-bottom: 20px; line-height: 1.5; }
.confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
.confirm-actions button {
  padding: 8px 20px;
  border-radius: 8px;
  font-family: var(--font-serif);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid var(--tree-line);
  background: var(--bg-input);
  color: var(--ink);
}
.confirm-actions button:hover { background: var(--tree-line); }
.confirm-actions .danger-btn {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}
.confirm-actions .danger-btn:hover { background: #a94a43; }

/* === RESPONSIVE === */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 50;
    box-shadow: var(--shadow-lg);

/* === BOOKMARK STYLES === */

.tree-node-row:hover .tree-bookmark-btn { opacity: 1; }
.tree-bookmark-btn.bookmarked { opacity: 1; color: #d4a017; }

.tree-node-row.has-bookmark { background: rgba(212,160,23,0.06); }

}
.tree-viz-card .viz-role {

  font-family: var(--font-mono);
  color: var(--ink-faint);
  margin-bottom: 2px;
}
.tree-viz-card .viz-label {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 2px;
}
.tree-viz-card .viz-content {
  font-size: 0.75rem;
  color: var(--ink-light);

}
.tree-viz-card .viz-bookmark {
  position: absolute;
  top: 4px;
  right: 6px;
  color: #d4a017;

}
.tree-viz-lines {

  margin-bottom: 0;
}
.tree-viz-lines svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.tree-viz-lines svg line {
  stroke: var(--tree-line);
  stroke-width: 1.5;
}
.tree-viz-btn {
  font-size: 0.72rem;
  color: var(--ink-faint);
  background: none;
  border: 1px solid var(--tree-line);
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 6px;
  font-family: var(--font-mono);

}
.tree-viz-btn:hover {
  color: var(--accent);

  background: var(--accent-light);
}

/* === CONTEXT LENGTH INDICATOR === */
.context-indicator {

  color: var(--ink-faint);
  font-family: var(--font-mono);

/* Subtle grain texture overlay */
.app::after {

  position: fixed;

  z-index: 999;
}
</style>
</head>

// ========================================
// 枝 · Branch Chat — Application Logic
// ========================================

(() => {
  'use strict';

  // --- Utility ---
  const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxx-xxxx-xxxx'.replace(/x/g, () => ((Math.random() * 16) | 0).toString(16));
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  const truncate = (s, n = 28) => s.length > n ? s.slice(0, n) + '…' : s;
  const formatTime = (ts) => new Date(ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

  // --- Storage keys ---
  const KEYS = { tree: 'branch_chat_tree', config: 'branch_chat_config_v2', sessions: 'branch_chat_sessions', activeSession: 'branch_chat_active_session' };

  // --- State ---
  let state = { nodes: {}, rootId: null, currentLeafId: null };
  let config = {
    apiKey: '',
    apiBase: 'https://api-inference.modelscope.cn/v1/chat/completions',
    model: 'Qwen/Qwen3-235B-A22B',
    temperature: 0.7,
    systemPrompt: '你是一个有用的AI助手。',
    aiOpening: '你好！有什么可以帮你的？',
    aiFields: {},       // { name:'', age:'', hairColor:'', ... }
    aiCustom: [],       // [ {key:'', value:''}, ... ]
    userPersona: '',
    userFields: {},
    userCustom: []
  };
  let isLoading = false;
  let pendingDeleteId = null;
  let collapsedNodes = new Set();
  let sessions = [];        // [{id, name, timestamp, config, state}]
  let activeSessionId = null;

  // Field labels for system prompt generation
  const FIELD_LABELS = {
    name: '姓名', age: '年龄', hairColor: '发色', eyeColor: '瞳色',
    hairStyle: '发型', eyeShape: '眼型', bodyType: '身材',
    personality: '性格', era: '时代背景'
  };

  // --- DOM refs ---
  const sidebar = $('#sidebar');
  const toggleBtn = $('#toggleSidebar');
  const configSection = $('#configSection');
  const configToggle = $('#configToggle');
  const treeRoot = $('#treeRoot');
  const chatMessages = $('#chatMessages');
  const userInput = $('#userInput');
  const sendBtn = $('#sendBtn');
  const pathInfo = $('#pathInfo');
  const errorToast = $('#errorToast');
  const confirmOverlay = $('#confirmOverlay');
  const confirmCancel = $('#confirmCancel');
  const confirmDelete = $('#confirmDelete');
  const apiKeyInput = $('#apiKeyInput');
  const apiBaseInput = $('#apiBaseInput');
  const modelInput = $('#modelInput');
  const systemPromptInput = $('#systemPromptInput');
  const aiOpeningInput = $('#aiOpeningInput');
  const userPersonaInput = $('#userPersonaInput');
  const tempSlider = $('#tempSlider');
  const tempValue = $('#tempValue');
  const aiCustomFields = $('#aiCustomFields');
  const userCustomFields = $('#userCustomFields');
  const sessionList = $('#sessionList');
  const newChatBtn = $('#newChatBtn');
  const contextIndicator = $('#contextIndicator');
  const treeVizBtn = $('#treeVizBtn');

  // --- Persistence ---
  function saveState() {
    localStorage.setItem(KEYS.tree, JSON.stringify({
      nodes: state.nodes, rootId: state.rootId, currentLeafId: state.currentLeafId
    }));
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(KEYS.tree);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.nodes && parsed.rootId) { state = parsed; return true; }
      }
    } catch (e) { console.warn('Failed to load state:', e); }
    return false;
  }

  /** Collect all config from DOM into config object and persist */
  function saveConfig() {
    config.apiKey = apiKeyInput.value.trim();
    config.apiBase = apiBaseInput.value.trim() || 'https://api-inference.modelscope.cn/v1/chat/completions';
    config.model = modelInput.value.trim() || 'Qwen/Qwen3-235B-A22B';
    config.temperature = parseFloat(tempSlider.value) || 0.7;
    config.systemPrompt = systemPromptInput.value.trim();
    config.aiOpening = aiOpeningInput.value.trim();
    config.userPersona = userPersonaInput.value.trim();

    // Collect AI advanced fields
    config.aiFields = {};
    $$('[data-ai-field]').forEach(el => {
      const v = el.value.trim();
      if (v) config.aiFields[el.dataset.aiField] = v;
    });

    // Collect User advanced fields
    config.userFields = {};
    $$('[data-user-field]').forEach(el => {
      const v = el.value.trim();
      if (v) config.userFields[el.dataset.userField] = v;
    });

    // Collect custom key-value pairs
    config.aiCustom = collectCustomPairs(aiCustomFields);
    config.userCustom = collectCustomPairs(userCustomFields);

    localStorage.setItem(KEYS.config, JSON.stringify(config));
  }

  function collectCustomPairs(container) {
    const pairs = [];
    container.querySelectorAll('.custom-row').forEach(row => {
      const k = row.querySelector('.key-input')?.value.trim();
      const v = row.querySelector('.val-input')?.value.trim();
      if (k || v) pairs.push({ key: k || '', value: v || '' });
    });
    return pairs;
  }

  function loadConfig() {
    try {
      const raw = localStorage.getItem(KEYS.config);
      if (raw) {
        const parsed = JSON.parse(raw);
        // Merge with defaults so new fields don't break
        config = { ...config, ...parsed };
      }
    } catch (e) { /* ignore */ }

    apiKeyInput.value = config.apiKey;
    apiBaseInput.value = config.apiBase;
    modelInput.value = config.model;
    tempSlider.value = config.temperature;
    tempValue.textContent = config.temperature.toFixed(1);
    systemPromptInput.value = config.systemPrompt;
    aiOpeningInput.value = config.aiOpening || '';
    userPersonaInput.value = config.userPersona || '';

    // Load AI advanced fields
    if (config.aiFields) {
      Object.entries(config.aiFields).forEach(([k, v]) => {
        const el = $(`[data-ai-field="${k}"]`);
        if (el) el.value = v;
      });
    }

    // Load User advanced fields
    if (config.userFields) {
      Object.entries(config.userFields).forEach(([k, v]) => {
        const el = $(`[data-user-field="${k}"]`);
        if (el) el.value = v;
      });
    }

    // Load custom pairs
    renderCustomPairs(aiCustomFields, config.aiCustom || []);
    renderCustomPairs(userCustomFields, config.userCustom || []);
  }

  // --- Custom key-value pair management ---
  function addCustomRow(container, key = '', value = '') {
    const row = document.createElement('div');
    row.className = 'custom-row';
    row.innerHTML = `<input class="key-input" placeholder="属性名" value="${escHtml(key)}"><input class="val-input" placeholder="属性值" value="${escHtml(value)}"><button class="remove-btn" title="移除">✕</button>`;
    row.querySelector('.remove-btn').addEventListener('click', () => { row.remove(); saveConfig(); });
    row.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('change', saveConfig);
      inp.addEventListener('blur', saveConfig);
    });
    container.appendChild(row);
  }

  function renderCustomPairs(container, pairs) {
    container.innerHTML = '';
    pairs.forEach(p => addCustomRow(container, p.key, p.value));
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // --- Build full system prompt from all settings ---
  function buildSystemPrompt() {
    const parts = [];

    // Base system prompt
    const base = config.systemPrompt || '你是一个有用的AI助手。';
    parts.push(base);

    // AI character profile
    const aiProfile = buildProfileText(config.aiFields, config.aiCustom, 'AI角色');
    if (aiProfile) parts.push(aiProfile);

    // User character profile
    const userProfile = buildProfileText(config.userFields, config.userCustom, '用户角色');
    if (userProfile) {
      parts.push(userProfile);
    }
    if (config.userPersona) {
      parts.push(`【用户人设补充】${config.userPersona}`);
    }

    // Era/background (from AI fields)
    if (config.aiFields?.era) {
      parts.push(`【时代背景】${config.aiFields.era}`);
    }

    return parts.join('\n\n');
  }

  function buildProfileText(fields, custom, label) {
    if (!fields) fields = {};
    if (!custom) custom = [];
    const lines = [];
    // Standard fields (skip 'era' as it's handled separately)
    for (const [k, lbl] of Object.entries(FIELD_LABELS)) {
      if (k === 'era') continue;
      if (fields[k]) lines.push(`${lbl}：${fields[k]}`);
    }
    // Custom fields
    for (const p of custom) {
      if (p.key && p.value) lines.push(`${p.key}：${p.value}`);
    }
    if (lines.length === 0) return '';
    return `【${label}设定】\n${lines.join('\n')}`;
  }

  // --- Tree operations ---
  function createNode(role, content, parentId) {
    const node = { id: uuid(), parentId, role, content, timestamp: Date.now(), children: [], bookmarked: false, label: '' };
    state.nodes[node.id] = node;
    if (parentId && state.nodes[parentId]) {
      state.nodes[parentId].children.push(node.id);
    }
    return node;
  }

  function getPathToNode(nodeId) {
    const path = [];
    let current = nodeId;
    while (current) { path.unshift(current); current = state.nodes[current]?.parentId || null; }
    return path;
  }

  function getDescendants(nodeId) {
    const result = [nodeId];
    const node = state.nodes[nodeId];
    if (node?.children) { for (const cid of node.children) result.push(...getDescendants(cid)); }
    return result;
  }

  function deleteNodeAndDescendants(nodeId) {
    const toRemove = getDescendants(nodeId);
    const node = state.nodes[nodeId];
    if (node?.parentId && state.nodes[node.parentId]) {
      state.nodes[node.parentId].children = state.nodes[node.parentId].children.filter(c => c !== nodeId);
    }
    for (const id of toRemove) { delete state.nodes[id]; collapsedNodes.delete(id); }
    if (toRemove.includes(state.currentLeafId)) state.currentLeafId = state.rootId;
    if (!state.nodes[state.rootId]) initDefaultTree();
    saveState();
  }

  function initDefaultTree() {
    state.nodes = {};
    const opening = config.aiOpening || '你好！有什么可以帮你的？';
    const root = createNode('assistant', opening, null);
    state.rootId = root.id;
    state.currentLeafId = root.id;
    saveState();
  }

  // --- Rendering ---
  function renderTree() {
    const currentPath = new Set(getPathToNode(state.currentLeafId));
    treeRoot.innerHTML = '';
    if (state.rootId && state.nodes[state.rootId]) renderTreeNode(state.rootId, treeRoot, currentPath);
  }

  function renderTreeNode(nodeId, parentEl, currentPath) {
    const node = state.nodes[nodeId];
    if (!node) return;
    const li = document.createElement('li');
    li.className = 'tree-node';
    const row = document.createElement('div');
    row.className = `tree-node-row role-${node.role}`;
    if (currentPath.has(nodeId)) row.classList.add('active');
    const hasChildren = node.children?.length > 0;
    const isCollapsed = collapsedNodes.has(nodeId);

    const expandBtn = document.createElement('button');
    expandBtn.className = 'tree-expand-btn';
    if (hasChildren) {
      expandBtn.textContent = isCollapsed ? '▶' : '▼';
      expandBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        collapsedNodes.has(nodeId) ? collapsedNodes.delete(nodeId) : collapsedNodes.add(nodeId);
        renderTree();
      });
    } else { expandBtn.textContent = '·'; expandBtn.style.cursor = 'default'; }

    const icon = document.createElement('span');
    icon.className = 'tree-icon';
    icon.textContent = node.role === 'user' ? '人' : '智';

    const text = document.createElement('span');
    text.className = 'tree-text';
    // Show label if set, otherwise truncated content
    if (node.label) {
      text.classList.add('tree-label-text');
      text.textContent = node.label;
    } else {
      text.textContent = truncate(node.content);
    }

    // Bookmark toggle button
    const bookmarkBtn = document.createElement('button');
    bookmarkBtn.className = 'tree-bookmark-btn' + (node.bookmarked ? ' bookmarked' : '');
    bookmarkBtn.textContent = node.bookmarked ? '★' : '☆';
    bookmarkBtn.title = '书签';
    bookmarkBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      node.bookmarked = !node.bookmarked;
      saveState();
      renderAll();
    });

    // Double-click to rename/add label
    row.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      const input = document.createElement('input');
      input.className = 'tree-rename-input';
      input.value = node.label || '';
      input.placeholder = '输入标签…';
      text.replaceWith(input);
      input.focus();
      input.select();
      const finish = () => {
        node.label = input.value.trim();
        saveState();
        renderTree();
      };
      input.addEventListener('blur', finish);
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
        if (ev.key === 'Escape') { input.value = node.label || ''; input.blur(); }
      });
    });

    if (node.bookmarked) row.classList.add('has-bookmark');

    const delBtn = document.createElement('button');
    delBtn.className = 'tree-delete-btn';
    delBtn.textContent = '✕';
    delBtn.title = '删除分支';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      pendingDeleteId = nodeId;
      const desc = getDescendants(nodeId).length;
      $('#confirmText').textContent = `将删除此节点及其 ${desc - 1} 个子节点，共 ${desc} 条消息。此操作不可撤销。`;
      confirmOverlay.classList.add('show');
    });

    row.addEventListener('click', () => { state.currentLeafId = nodeId; saveState(); renderAll(); });
    row.append(expandBtn, icon, text, bookmarkBtn, delBtn);
    li.appendChild(row);

    if (hasChildren && !isCollapsed) {
      const childUl = document.createElement('ul');
      for (const cid of node.children) renderTreeNode(cid, childUl, currentPath);
      li.appendChild(childUl);
    }
    parentEl.appendChild(li);
  }

  function renderChat() {
    const path = getPathToNode(state.currentLeafId);
    chatMessages.innerHTML = '';
    for (let pi = 0; pi < path.length; pi++) {
      const nid = path[pi];
      const node = state.nodes[nid];
      if (!node) continue;
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${node.role}`;

      // Label tag above bubble
      if (node.label) {
        const labelTag = document.createElement('span');
        labelTag.className = 'msg-label-tag';
        labelTag.textContent = node.label;
        msgDiv.appendChild(labelTag);
      }

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';

      // Bookmark indicator inside bubble
      if (node.bookmarked) {
        const bmInd = document.createElement('span');
        bmInd.className = 'msg-bookmark-indicator';
        bmInd.textContent = '★ ';
        bubble.appendChild(bmInd);
      }
      bubble.appendChild(document.createTextNode(node.content));

      const meta = document.createElement('div');
      meta.className = 'message-meta';
      const time = document.createElement('span');
      time.className = 'message-time';
      time.textContent = formatTime(node.timestamp);
      if (node.children.length > 1) {
        const branchInd = document.createElement('span');
        branchInd.className = 'branch-indicator';
        branchInd.textContent = `${node.children.length} 分支`;
        meta.appendChild(branchInd);
      }
      const branchBtn = document.createElement('button');
      branchBtn.className = 'message-branch-btn';
      branchBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg> 在此分支`;
      branchBtn.addEventListener('click', () => {
        state.currentLeafId = node.id; saveState(); renderAll(); userInput.focus();
      });
      meta.prepend(time);
      meta.appendChild(branchBtn);

      // Regenerate button: only on assistant messages that are the last in path (leaf or near-leaf)
      if (node.role === 'assistant' && pi === path.length - 1 && node.parentId) {
        const regenBtn = document.createElement('button');
        regenBtn.className = 'msg-regenerate-btn';
        regenBtn.textContent = '⟳ 重新生成';
        regenBtn.addEventListener('click', () => { regenerateResponse(node.id); });
        meta.appendChild(regenBtn);
      }

      msgDiv.append(bubble, meta);
      chatMessages.appendChild(msgDiv);
    }
    // Update path info + context indicator
    pathInfo.innerHTML = `路径深度: <strong>${path.length}</strong>`;
    updateContextIndicator(path);
    requestAnimationFrame(() => { chatMessages.scrollTop = chatMessages.scrollHeight; });
  }

  function renderAll() { renderTree(); renderChat(); }

  // --- API call ---
  async function sendMessage(userText) {
    if (!userText.trim() || isLoading) return;
    saveConfig();
    if (!config.apiKey) { showError('请先在侧栏设置中填写 API 密钥'); return; }

    const userNode = createNode('user', userText.trim(), state.currentLeafId);
    state.currentLeafId = userNode.id;
    saveState(); renderAll();

    isLoading = true;
    sendBtn.disabled = true;
    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking';
    thinkingEl.innerHTML = '<div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div>';
    chatMessages.appendChild(thinkingEl);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    // Build messages: system prompt (composed from all settings) + conversation path
    const fullSystemPrompt = buildSystemPrompt();
    const path = getPathToNode(userNode.id);
    const messages = [{ role: 'system', content: fullSystemPrompt }];
    for (const nid of path) {
      const n = state.nodes[nid];
      if (n) messages.push({ role: n.role, content: n.content });
    }

    try {
      const resp = await fetch(config.apiBase, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
        body: JSON.stringify({ model: config.model, messages, temperature: config.temperature })
      });
      if (!resp.ok) {
        const errBody = await resp.text().catch(() => '');
        if (resp.status === 401) throw new Error('API 密钥无效 (401 Unauthorized)');
        if (resp.status === 429) throw new Error('请求过于频繁，请稍后再试 (429)');
        throw new Error(`API 请求失败 (${resp.status}): ${errBody.slice(0, 100)}`);
      }
      const data = await resp.json();
      const aiContent = data.choices?.[0]?.message?.content || '(无响应内容)';
      const aiNode = createNode('assistant', aiContent, userNode.id);
      state.currentLeafId = aiNode.id;
      saveState();
    } catch (err) {
      showError(err.message || '网络错误，请检查连接');
      const errNode = createNode('assistant', `⚠ 错误: ${err.message}`, userNode.id);
      state.currentLeafId = errNode.id;
      saveState();
    } finally {
      isLoading = false; sendBtn.disabled = false; thinkingEl.remove(); renderAll(); saveCurrentSession(); renderSessions();
    }
  }

  // --- Error toast ---
  let errorTimeout;
  function showError(msg) {
    errorToast.textContent = msg;
    errorToast.classList.add('show');
    clearTimeout(errorTimeout);
    errorTimeout = setTimeout(() => errorToast.classList.remove('show'), 4000);
  }

  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

  // --- Session Management ---

  /** Generate a session name from the first user message or AI config name */
  function generateSessionName() {
    // Try to find first user message in tree
    if (state.rootId) {
      const root = state.nodes[state.rootId];
      if (root?.children?.length) {
        for (const cid of root.children) {
          const child = state.nodes[cid];
          if (child?.role === 'user') return truncate(child.content, 20);
        }
      }
    }
    // Fall back to AI character name or generic
    if (config.aiFields?.name) return `与${config.aiFields.name}的对话`;
    const d = new Date();
    return `对话 ${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  /** Count total messages in tree */
  function countMessages() {
    return Object.keys(state.nodes).length;
  }

  function loadSessions() {
    try {
      const raw = localStorage.getItem(KEYS.sessions);
      if (raw) sessions = JSON.parse(raw) || [];
    } catch (e) { sessions = []; }
    activeSessionId = localStorage.getItem(KEYS.activeSession) || null;
  }

  function saveSessions() {
    localStorage.setItem(KEYS.sessions, JSON.stringify(sessions));
    if (activeSessionId) localStorage.setItem(KEYS.activeSession, activeSessionId);
  }

  /** Save the current working state into the active session slot */
  function saveCurrentSession() {
    saveConfig(); // ensure config is up-to-date from DOM
    if (!activeSessionId) {
      // Create a new session for current state
      activeSessionId = uuid();
    }
    const idx = sessions.findIndex(s => s.id === activeSessionId);
    const sessionData = {
      id: activeSessionId,
      name: (idx >= 0 && sessions[idx].name) ? sessions[idx].name : generateSessionName(),
      timestamp: Date.now(),
      msgCount: countMessages(),
      config: JSON.parse(JSON.stringify(config)),
      state: JSON.parse(JSON.stringify(state))
    };
    // Don't store apiKey in session (keep it global)
    delete sessionData.config.apiKey;

    if (idx >= 0) {
      sessions[idx] = sessionData;
    } else {
      sessions.unshift(sessionData);
    }
    saveSessions();
    // Also save to legacy keys for backward compat
    saveState();
  }

  /** Switch to a different session */
  function switchToSession(sessionId) {
    if (sessionId === activeSessionId) return;
    // Save current first
    saveCurrentSession();

    const session = sessions.find(s => s.id === sessionId);
    if (!session) return;

    // Restore config (preserve apiKey from current)
    const savedApiKey = config.apiKey;
    config = { ...config, ...session.config };
    config.apiKey = savedApiKey;

    // Restore state
    state = session.state;
    activeSessionId = sessionId;
    localStorage.setItem(KEYS.activeSession, activeSessionId);
    collapsedNodes = new Set();

    // Update DOM
    loadConfigToDOM();
    saveState();
    renderAll();
    renderSessions();
  }

  /** Load config values into DOM inputs (without reading from localStorage) */
  function loadConfigToDOM() {
    apiKeyInput.value = config.apiKey;
    apiBaseInput.value = config.apiBase;
    modelInput.value = config.model;
    tempSlider.value = config.temperature;
    tempValue.textContent = (config.temperature || 0.7).toFixed(1);
    systemPromptInput.value = config.systemPrompt || '';
    aiOpeningInput.value = config.aiOpening || '';
    userPersonaInput.value = config.userPersona || '';

    // Clear and reload AI advanced fields
    $$('[data-ai-field]').forEach(el => { el.value = ''; });
    if (config.aiFields) {
      Object.entries(config.aiFields).forEach(([k, v]) => {
        const el = $(`[data-ai-field="${k}"]`);
        if (el) el.value = v;
      });
    }
    $$('[data-user-field]').forEach(el => { el.value = ''; });
    if (config.userFields) {
      Object.entries(config.userFields).forEach(([k, v]) => {
        const el = $(`[data-user-field="${k}"]`);
        if (el) el.value = v;
      });
    }
    renderCustomPairs(aiCustomFields, config.aiCustom || []);
    renderCustomPairs(userCustomFields, config.userCustom || []);
  }

  /** Create a brand new session */
  function createNewSession() {
    // Save current session first
    if (activeSessionId && countMessages() > 0) {
      saveCurrentSession();
    }

    // Reset to defaults (preserve API connection settings)
    const savedApiKey = config.apiKey;
    const savedApiBase = config.apiBase;
    const savedModel = config.model;
    config = {
      apiKey: savedApiKey,
      apiBase: savedApiBase,
      model: savedModel,
      temperature: 0.7,
      systemPrompt: '你是一个有用的AI助手。',
      aiOpening: '你好！有什么可以帮你的？',
      aiFields: {},
      aiCustom: [],
      userPersona: '',
      userFields: {},
      userCustom: []
    };

    activeSessionId = uuid();
    localStorage.setItem(KEYS.activeSession, activeSessionId);
    collapsedNodes = new Set();

    // Init fresh tree
    initDefaultTree();
    loadConfigToDOM();
    renderAll();

    // Save this new session immediately
    saveCurrentSession();
    renderSessions();
    userInput.focus();
  }

  /** Delete a saved session */
  function deleteSession(sessionId) {
    sessions = sessions.filter(s => s.id !== sessionId);
    saveSessions();
    // If we deleted the active session, switch to the first available or create new
    if (sessionId === activeSessionId) {
      if (sessions.length > 0) {
        switchToSession(sessions[0].id);
      } else {
        activeSessionId = null;
        createNewSession();
      }
    }
    renderSessions();
  }

  /** Rename a session */
  function renameSession(sessionId, newName) {
    const session = sessions.find(s => s.id === sessionId);
    if (session && newName.trim()) {
      session.name = newName.trim();
      saveSessions();
      renderSessions();
    }
  }

  /** Render the session list in sidebar */
  function renderSessions() {
    sessionList.innerHTML = '';
    if (sessions.length === 0) {
      sessionList.innerHTML = '<li class="session-empty">暂无存档</li>';
      return;
    }
    // Sort by timestamp descending
    const sorted = [...sessions].sort((a, b) => b.timestamp - a.timestamp);
    for (const s of sorted) {
      const li = document.createElement('li');
      li.className = `session-item${s.id === activeSessionId ? ' active' : ''}`;

      const icon = document.createElement('span');
      icon.className = 'session-icon';
      icon.textContent = '💬';

      const info = document.createElement('div');
      info.className = 'session-info';

      const name = document.createElement('span');
      name.className = 'session-name';
      name.textContent = s.name;

      const meta = document.createElement('span');
      meta.className = 'session-meta-text';
      const dt = new Date(s.timestamp);
      meta.textContent = `${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')} · ${s.msgCount || '?'}条`;

      info.append(name, meta);

      const actions = document.createElement('div');
      actions.className = 'session-actions';

      const renameBtn = document.createElement('button');
      renameBtn.className = 'session-act-btn';
      renameBtn.textContent = '✎';
      renameBtn.title = '重命名';
      renameBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        // Replace name span with input
        const input = document.createElement('input');
        input.className = 'session-rename-input';
        input.value = s.name;
        name.replaceWith(input);
        input.focus();
        input.select();
        const finish = () => { renameSession(s.id, input.value); };
        input.addEventListener('blur', finish);
        input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); } if (ev.key === 'Escape') { input.value = s.name; input.blur(); } });
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'session-act-btn del';
      delBtn.textContent = '✕';
      delBtn.title = '删除存档';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        pendingDeleteId = '__session__' + s.id;
        $('#confirmText').textContent = `删除存档「${s.name}」？此操作不可撤销。`;
        confirmOverlay.classList.add('show');
      });

      actions.append(renameBtn, delBtn);
      li.append(icon, info, actions);

      li.addEventListener('click', () => switchToSession(s.id));
      sessionList.appendChild(li);
    }
  }

  // --- Collapsible section helper ---
  function setupToggle(toggleEl, sectionEl, className) {
    toggleEl.addEventListener('click', () => sectionEl.classList.toggle(className));
  }

  // --- Regenerate AI response ---
  async function regenerateResponse(assistantNodeId) {
    if (isLoading) return;
    const node = state.nodes[assistantNodeId];
    if (!node || node.role !== 'assistant' || !node.parentId) return;
    const parentId = node.parentId;
    const parentNode = state.nodes[parentId];
    if (!parentNode || parentNode.role !== 'user') return;

    saveConfig();
    if (!config.apiKey) { showError('请先在侧栏设置中填写 API 密钥'); return; }

    // Delete the current assistant node and its descendants
    deleteNodeAndDescendants(assistantNodeId);
    state.currentLeafId = parentId;
    saveState();
    renderAll();

    // Re-send the request
    isLoading = true;
    sendBtn.disabled = true;
    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking';
    thinkingEl.innerHTML = '<div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div>';
    chatMessages.appendChild(thinkingEl);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    const fullSystemPrompt = buildSystemPrompt();
    const path = getPathToNode(parentId);
    const messages = [{ role: 'system', content: fullSystemPrompt }];
    for (const nid of path) {
      const n = state.nodes[nid];
      if (n) messages.push({ role: n.role, content: n.content });
    }

    try {
      const resp = await fetch(config.apiBase, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
        body: JSON.stringify({ model: config.model, messages, temperature: config.temperature })
      });
      if (!resp.ok) {
        const errBody = await resp.text().catch(() => '');
        throw new Error(`API 请求失败 (${resp.status}): ${errBody.slice(0, 100)}`);
      }
      const data = await resp.json();
      const aiContent = data.choices?.[0]?.message?.content || '(无响应内容)';
      const aiNode = createNode('assistant', aiContent, parentId);
      state.currentLeafId = aiNode.id;
      saveState();
    } catch (err) {
      showError(err.message || '网络错误，请检查连接');
      const errNode = createNode('assistant', `⚠ 错误: ${err.message}`, parentId);
      state.currentLeafId = errNode.id;
      saveState();
    } finally {
      isLoading = false; sendBtn.disabled = false; thinkingEl.remove(); renderAll(); saveCurrentSession(); renderSessions();
    }
  }

  // --- Context Length Indicator ---
  function estimateTokens(text) {
    let tokens = 0;
    // Split into segments of Chinese vs non-Chinese
    const chineseChars = text.match(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/g);
    tokens += (chineseChars ? chineseChars.length : 0) * 1.5;
    // English words: everything else split by whitespace
    const nonChinese = text.replace(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/g, ' ');
    const words = nonChinese.split(/\s+/).filter(w => w.length > 0);
    tokens += words.length * 0.75;
    return Math.round(tokens);
  }

  function updateContextIndicator(path) {
    let totalTokens = 0;
    for (const nid of path) {
      const node = state.nodes[nid];
      if (node) totalTokens += estimateTokens(node.content);
    }
    // Also add system prompt tokens estimate
    totalTokens += estimateTokens(buildSystemPrompt());
    contextIndicator.textContent = `· 约 ${totalTokens.toLocaleString()} tokens`;
  }

  // --- Character Card Import/Export ---
  function exportCharacterCard(type) {
    saveConfig();
    let cardData;
    if (type === 'ai') {
      cardData = {
        type: 'ai_character_card',
        systemPrompt: config.systemPrompt,
        aiOpening: config.aiOpening,
        aiFields: config.aiFields,
        aiCustom: config.aiCustom
      };
    } else {
      cardData = {
        type: 'user_character_card',
        userPersona: config.userPersona,
        userFields: config.userFields,
        userCustom: config.userCustom
      };
    }
    downloadJSON(cardData, `${type}_character_card.json`);
  }

  let pendingCardImportType = null;
  function importCharacterCard(type) {
    pendingCardImportType = type;
    cardImportInput.click();
  }

  function handleCardImport(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (pendingCardImportType === 'ai') {
          if (data.systemPrompt !== undefined) config.systemPrompt = data.systemPrompt;
          if (data.aiOpening !== undefined) config.aiOpening = data.aiOpening;
          if (data.aiFields !== undefined) config.aiFields = data.aiFields;
          if (data.aiCustom !== undefined) config.aiCustom = data.aiCustom;
        } else {
          if (data.userPersona !== undefined) config.userPersona = data.userPersona;
          if (data.userFields !== undefined) config.userFields = data.userFields;
          if (data.userCustom !== undefined) config.userCustom = data.userCustom;
        }
        localStorage.setItem(KEYS.config, JSON.stringify(config));
        loadConfigToDOM();
        showError('角色卡导入成功！');
      } catch (err) {
        showError('导入失败：文件格式无效');
      }
    };
    reader.readAsText(file);
  }

  // --- Full Import/Export ---
  function exportAll() {
    saveConfig();
    saveCurrentSession();
    const exportData = {
      type: 'branch_chat_full_export',
      version: 1,
      exportDate: new Date().toISOString(),
      config: { ...config, apiKey: '' }, // Exclude API key
      state: JSON.parse(JSON.stringify(state)),
      sessions: JSON.parse(JSON.stringify(sessions)),
      activeSessionId
    };
    // Also strip apiKey from session configs
    exportData.sessions.forEach(s => { if (s.config) delete s.config.apiKey; });
    downloadJSON(exportData, `branch_chat_export_${new Date().toISOString().slice(0,10)}.json`);
  }

  function importAll() {
    fileImportInput.click();
  }

  function handleFullImport(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.type !== 'branch_chat_full_export') {
          showError('导入失败：文件格式不匹配');
          return;
        }
        // Show confirmation
        pendingDeleteId = '__import__';
        $('#confirmText').textContent = '导入将覆盖当前所有数据（对话、设置、存档）。确认导入？';
        $('#confirmDelete').textContent = '导入';
        confirmOverlay.classList.add('show');
        // Store import data temporarily
        window.__pendingImport = data;
      } catch (err) {
        showError('导入失败：文件格式无效');
      }
    };
    reader.readAsText(file);
  }

  function executeFullImport(data) {
    const savedApiKey = config.apiKey;
    if (data.config) {
      config = { ...config, ...data.config };
      config.apiKey = savedApiKey; // Preserve current API key
    }
    if (data.state) state = data.state;
    if (data.sessions) sessions = data.sessions;
    if (data.activeSessionId) activeSessionId = data.activeSessionId;

    localStorage.setItem(KEYS.config, JSON.stringify(config));
    saveState();
    saveSessions();
    collapsedNodes = new Set();
    loadConfigToDOM();
    renderAll();
    renderSessions();
    showError('数据导入成功！');
  }

  function downloadJSON(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // --- Tree Visualization ---
  function openTreeViz() {
    treeVizOverlay.classList.add('show');
    renderTreeViz();
  }

  function closeTreeViz() {
    treeVizOverlay.classList.remove('show');
  }

  function renderTreeViz() {
    treeVizContainer.innerHTML = '';
    if (!state.rootId || !state.nodes[state.rootId]) return;

    const currentPath = new Set(getPathToNode(state.currentLeafId));

    // Build levels (BFS)
    const levels = [];
    let currentLevel = [state.rootId];
    while (currentLevel.length > 0) {
      levels.push(currentLevel);
      const nextLevel = [];
      for (const nid of currentLevel) {
        const node = state.nodes[nid];
        if (node?.children) nextLevel.push(...node.children);
      }
      currentLevel = nextLevel;
    }

    // Track card elements for line drawing
    const cardEls = {};

    for (let li = 0; li < levels.length; li++) {
      const levelDiv = document.createElement('div');
      levelDiv.className = 'tree-viz-level';
      levelDiv.dataset.level = li;

      for (const nid of levels[li]) {
        const node = state.nodes[nid];
        if (!node) continue;
        const card = document.createElement('div');
        card.className = 'tree-viz-card' + (currentPath.has(nid) ? ' on-path' : '');
        card.dataset.nodeId = nid;

        let html = `<div class="viz-role">${node.role === 'user' ? '👤 用户' : '🤖 AI'}</div>`;
        if (node.label) html += `<div class="viz-label">${escHtml(node.label)}</div>`;
        html += `<div class="viz-content">${escHtml(truncate(node.content, 40))}</div>`;
        if (node.bookmarked) html += `<div class="viz-bookmark">★</div>`;
        card.innerHTML = html;

        card.addEventListener('click', () => {
          state.currentLeafId = nid;
          saveState();
          renderAll();
          closeTreeViz();
        });

        levelDiv.appendChild(card);
        cardEls[nid] = card;
      }

      treeVizContainer.appendChild(levelDiv);

      // Draw lines between this level and next
      if (li < levels.length - 1) {
        const linesDiv = document.createElement('div');
        linesDiv.className = 'tree-viz-lines';
        treeVizContainer.appendChild(linesDiv);
      }
    }

    // Draw connecting lines after layout
    requestAnimationFrame(() => {
      const lineDivs = treeVizContainer.querySelectorAll('.tree-viz-lines');
      for (let li = 0; li < lineDivs.length; li++) {
        const linesDiv = lineDivs[li];
        const containerRect = treeVizContainer.getBoundingClientRect();
        const lineRect = linesDiv.getBoundingClientRect();
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', lineRect.width);
        svg.setAttribute('height', lineRect.height);
        svg.style.width = lineRect.width + 'px';
        svg.style.height = lineRect.height + 'px';

        for (const nid of levels[li]) {
          const node = state.nodes[nid];
          if (!node?.children) continue;
          const parentCard = cardEls[nid];
          if (!parentCard) continue;
          const pRect = parentCard.getBoundingClientRect();
          const px = pRect.left + pRect.width / 2 - lineRect.left;

          for (const cid of node.children) {
            const childCard = cardEls[cid];
            if (!childCard) continue;
            const cRect = childCard.getBoundingClientRect();
            const cx = cRect.left + cRect.width / 2 - lineRect.left;
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', px);
            line.setAttribute('y1', 0);
            line.setAttribute('x2', cx);
            line.setAttribute('y2', lineRect.height);
            svg.appendChild(line);
          }
        }
        linesDiv.appendChild(svg);
      }
    });
  }

  // --- Event listeners ---

  // Sidebar toggle
  toggleBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

  // Config section toggles
  setupToggle($('#configToggle'), $('#configSection'), 'collapsed-config');
  setupToggle($('#aiCharToggle'), $('#aiCharSection'), 'collapsed-sub');
  setupToggle($('#userCharToggle'), $('#userCharSection'), 'collapsed-sub');
  setupToggle($('#aiAdvToggle'), $('#aiAdvPanel'), 'collapsed-adv');
  setupToggle($('#userAdvToggle'), $('#userAdvPanel'), 'collapsed-adv');

  // Temperature slider
  tempSlider.addEventListener('input', () => {
    tempValue.textContent = parseFloat(tempSlider.value).toFixed(1);
  });
  tempSlider.addEventListener('change', saveConfig);

  // Auto-save all config inputs on change/blur
  const configInputs = [apiKeyInput, apiBaseInput, modelInput, systemPromptInput, aiOpeningInput, userPersonaInput];
  for (const el of configInputs) {
    el.addEventListener('change', saveConfig);
    el.addEventListener('blur', saveConfig);
  }
  // Also save advanced field inputs
  $$('[data-ai-field], [data-user-field]').forEach(el => {
    el.addEventListener('change', saveConfig);
    el.addEventListener('blur', saveConfig);
  });

  // Add custom field buttons
  $('#aiAddFieldBtn').addEventListener('click', () => { addCustomRow(aiCustomFields); saveConfig(); });
  $('#userAddFieldBtn').addEventListener('click', () => { addCustomRow(userCustomFields); saveConfig(); });

  // Send message
  sendBtn.addEventListener('click', () => {
    const text = userInput.value; userInput.value = ''; autoResize(userInput); sendMessage(text);
  });
  userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });
  userInput.addEventListener('input', () => autoResize(userInput));

  // Confirm delete dialog (handles both tree nodes and sessions)
  confirmCancel.addEventListener('click', () => { pendingDeleteId = null; confirmOverlay.classList.remove('show'); $('#confirmDelete').textContent = '删除'; });
  confirmDelete.addEventListener('click', () => {
    if (pendingDeleteId) {
      if (pendingDeleteId === '__import__' && window.__pendingImport) {
        executeFullImport(window.__pendingImport);
        window.__pendingImport = null;
        $('#confirmDelete').textContent = '删除'; // Reset button text
      } else if (typeof pendingDeleteId === 'string' && pendingDeleteId.startsWith('__session__')) {
        deleteSession(pendingDeleteId.replace('__session__', ''));
      } else {
        deleteNodeAndDescendants(pendingDeleteId);
        renderAll();
      }
      pendingDeleteId = null;
      confirmOverlay.classList.remove('show');
    }
  });
  confirmOverlay.addEventListener('click', (e) => { if (e.target === confirmOverlay) { pendingDeleteId = null; confirmOverlay.classList.remove('show'); $('#confirmDelete').textContent = '删除'; } });

  // New chat button
  newChatBtn.addEventListener('click', createNewSession);

  // Character card import/export
  $('#exportAiCardBtn').addEventListener('click', () => exportCharacterCard('ai'));
  $('#importAiCardBtn').addEventListener('click', () => importCharacterCard('ai'));
  $('#exportUserCardBtn').addEventListener('click', () => exportCharacterCard('user'));
  $('#importUserCardBtn').addEventListener('click', () => importCharacterCard('user'));
  cardImportInput.addEventListener('change', (e) => {
    if (e.target.files[0]) { handleCardImport(e.target.files[0]); e.target.value = ''; }
  });

  // Full import/export
  $('#exportAllBtn').addEventListener('click', exportAll);
  $('#importAllBtn').addEventListener('click', importAll);
  fileImportInput.addEventListener('change', (e) => {
    if (e.target.files[0]) { handleFullImport(e.target.files[0]); e.target.value = ''; }
  });

  // Tree visualization
  treeVizBtn.addEventListener('click', openTreeViz);
  treeVizClose.addEventListener('click', closeTreeViz);
  treeVizOverlay.addEventListener('click', (e) => { if (e.target === treeVizOverlay) closeTreeViz(); });

  // Auto-save session periodically when sending messages (patch sendMessage)
  const origSaveState = saveState;

  // --- Initialize ---
  loadSessions();
  loadConfig();
  if (!loadState()) initDefaultTree();
  // If no active session, create one
  if (!activeSessionId) {
    activeSessionId = uuid();
    localStorage.setItem(KEYS.activeSession, activeSessionId);
    saveCurrentSession();
  }
  renderAll();
  renderSessions();
  userInput.focus();

  // Default: collapse advanced panels and user section to reduce initial noise
  $('#aiAdvPanel').classList.add('collapsed-adv');
  $('#userAdvPanel').classList.add('collapsed-adv');
  $('#userCharSection').classList.add('collapsed-sub');

})();
</script>
